name: Bug report
description: Thea does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not paste API keys, tokens or passwords. Security issues go through SECURITY.md, not here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Error messages or logs, with secrets removed.
      render: text
  - type: input
    id: version
    attributes:
      label: Thea version
      description: Release version or commit hash.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: e.g. macOS 15 / Windows 11, Ollama 0.6 with qwen3:8b
    validations:
      required: true
