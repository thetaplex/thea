name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Linux: hosted macOS runners were not available. Releases are still built on a Mac.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Tauri's Linux build prerequisites (D-Bus is for tao).
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: extractions/setup-just@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: rustup component add clippy
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project agent --locked
      # Tauri checks at compile time that the bundled frontend and Python runtime folders exist.
      - run: mkdir -p dist agent/dist/python
      - run: just check
