name: Release

# Push a tag `v<version>` (`just release`) to build both installers and publish the release.
# Run it by hand to build the installers as workflow artifacts without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            triple: aarch64-apple-darwin
            bundles: app,dmg
            out: src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            bundles: nsis
            out: src-tauri/target/release/bundle/nsis/*-setup.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.4.0
      - uses: extractions/setup-just@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: just bundle-agent ${{ matrix.triple }}
      - run: pnpm tauri build --bundles ${{ matrix.bundles }}
        env:
          CI: true
      # A bundle without a full signature opens as "damaged" once it is downloaded.
      - if: runner.os == 'macOS'
        run: codesign --verify --deep --strict src-tauri/target/release/bundle/macos/Thea.app
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.triple }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: installers
      - name: Create the release and upload the installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            printf '%s\n\n' "Thea is in beta. The installers have no code signature from Apple or Microsoft, so macOS and Windows show a warning the first time you open Thea. See [Install Thea](https://github.com/${{ github.repository }}/blob/main/docs/how-to/install-thea.md)."
            awk -v h="## [${TAG#v}]" 'index($0,h)==1{on=1;next} on&&/^## \[/{exit} on' CHANGELOG.md
          } > release-notes.md
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Thea $TAG (beta)" --notes-file release-notes.md
          gh release upload "$TAG" --clobber installers/*
